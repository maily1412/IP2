[project]
name = "lebensmittel-inventar"
version = "0.1.0"
description = "Backend der Lebensmittel-Inventar-App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
